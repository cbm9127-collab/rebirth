<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏃 운동 & 러닝 기록</title>
<style>
  :root {
    --teal: #1D9E75; --teal-dark: #0F6E56; --teal-light: #E1F5EE;
    --bg: #FAFAF8; --surface: #F3F2EE;
    --border: rgba(0,0,0,0.08); --text: #1C1C1A; --text-2: #6B6B67; --text-3: #9E9E9A;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrapper { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 10px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .back-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-2); background: var(--surface); border: 0.5px solid var(--border); padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer; text-decoration: none; transition: background 0.15s; }
  .back-btn:hover { background: var(--teal-light); color: var(--teal-dark); }
  .header-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
  .add-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: white; background: var(--teal); border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: background 0.15s; }
  .add-btn:hover { background: var(--teal-dark); }

  .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1.5rem; }
  .summary-card { background: white; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; text-align: center; }
  .summary-num { font-size: 26px; font-weight: 700; color: var(--teal-dark); line-height: 1; }
  .summary-lbl { font-size: 11px; color: var(--text-3); margin-top: 5px; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .filter-btn { font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: var(--teal-dark); color: white; border-color: var(--teal-dark); }

  .record-list { display: flex; flex-direction: column; gap: 12px; }
  .run-card { background: white; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; border-left: 3px solid var(--teal); }
  .run-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .run-date { font-size: 13px; font-weight: 600; }
  .run-delete-btn { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 6px; }
  .run-delete-btn:hover { background: #FEF2F2; color: #D85A30; }
  .run-metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 10px; }
  .run-metric { text-align: center; background: var(--surface); border-radius: 8px; padding: 8px 4px; }
  .run-metric-val { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1; }
  .run-metric-val.teal { color: var(--teal-dark); }
  .run-metric-lbl { font-size: 10px; color: var(--text-3); margin-top: 3px; }
  .run-photos { display: grid; gap: 8px; margin-bottom: 8px; }
  .run-photos.cols-2 { grid-template-columns: 1fr 1fr; }
  .run-photo-img { width: 100%; border-radius: 8px; object-fit: cover; cursor: pointer; max-height: 160px; }
  .run-memo { font-size: 12px; color: var(--text-2); background: var(--surface); border-radius: 6px; padding: 8px 10px; line-height: 1.6; font-style: italic; }

  .stat-section { margin-bottom: 1.5rem; }
  .stat-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
  .best-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .best-card { background: white; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; }
  .best-card-val { font-size: 22px; font-weight: 700; color: var(--teal-dark); }
  .best-card-lbl { font-size: 11px; color: var(--text-3); margin-top: 4px; }
  .week-bars { display: flex; gap: 6px; align-items: flex-end; height: 80px; background: white; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .week-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .week-bar { width: 100%; background: var(--teal-light); border-radius: 3px 3px 0 0; min-height: 3px; }
  .week-bar.today { background: var(--teal); }
  .week-bar-val { font-size: 9px; color: var(--text-3); }
  .week-bar-lbl { font-size: 9px; color: var(--text-3); }

  .empty { text-align: center; padding: 4rem 0; color: var(--text-3); }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }
  .empty-title { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet { background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 720px; padding: 20px 1.25rem 32px; max-height: 92vh; overflow-y: auto; animation: slideUp .22s ease; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
  .sheet-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .field-lbl { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
  .field-inp { width: 100%; padding: 10px 12px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text); outline: none; }
  .field-inp:focus { border-color: var(--teal); background: white; }
  .field-group { margin-bottom: 12px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .photo-upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .photo-slot { position: relative; }
  .photo-lbl-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 100%; height: 80px; border: 0.5px dashed var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; color: var(--text-3); background: var(--surface); transition: all 0.15s; }
  .photo-lbl-btn:hover { border-color: var(--teal); color: var(--teal-dark); }
  .photo-prev { display: none; width: 100%; height: 80px; object-fit: cover; border-radius: var(--radius-sm); }
  .photo-del { display: none; position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.5); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; line-height: 20px; text-align: center; padding: 0; }
  .pace-hint { font-size: 11px; color: var(--text-3); margin: 4px 0 12px; padding-left: 2px; }
  .save-btn { width: 100%; padding: 13px; background: var(--teal); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .save-btn:hover { background: var(--teal-dark); }
  .save-btn:disabled { opacity: .55; cursor: not-allowed; }
  .save-msg { font-size: 12px; text-align: center; margin-top: 8px; min-height: 18px; color: var(--teal-dark); }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 85vh; border-radius: var(--radius); }
  .lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,.15); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }

  @media (max-width: 540px) {
    .wrapper { padding: 1.25rem 0.875rem 3rem; }
    .run-metrics { grid-template-columns: repeat(2,1fr); }
    .summary-num { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="header-left">
      <a class="back-btn" href="rebirth_dashboard.html">← 대시보드로</a>
      <div>
        <div class="header-title">🏃 운동 &amp; 러닝 기록</div>
        <div class="header-sub" id="header-sub">불러오는 중...</div>
      </div>
    </div>
    <button class="add-btn" onclick="openSheet()">+ 기록하기</button>
  </div>

  <div class="summary-grid">
    <div class="summary-card"><div class="summary-num" id="stat-total-km">—</div><div class="summary-lbl">총 거리 (km)</div></div>
    <div class="summary-card"><div class="summary-num" id="stat-count">—</div><div class="summary-lbl">총 횟수</div></div>
    <div class="summary-card"><div class="summary-num" id="stat-streak">—</div><div class="summary-lbl">연속 (일)</div></div>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" id="tab-log"  onclick="setTab('log',this)">기록</button>
    <button class="filter-btn"        id="tab-stat" onclick="setTab('stat',this)">통계</button>
  </div>

  <div id="view-log"><div class="record-list" id="run-list"></div></div>
  <div id="view-stat" style="display:none;">
    <div class="stat-section">
      <div class="stat-title">이번 주 일별 거리 (km)</div>
      <div class="week-bars" id="week-bars"></div>
    </div>
    <div class="stat-section">
      <div class="stat-title">🏆 베스트 기록</div>
      <div class="best-grid">
        <div class="best-card"><div class="best-card-val" id="best-km">—</div><div class="best-card-lbl">최장 거리 (km)</div></div>
        <div class="best-card"><div class="best-card-val" id="best-pace">—</div><div class="best-card-lbl">최고 페이스</div></div>
        <div class="best-card"><div class="best-card-val" id="best-min">—</div><div class="best-card-lbl">최장 시간 (분)</div></div>
        <div class="best-card"><div class="best-card-val" id="avg-km">—</div><div class="best-card-lbl">평균 거리 (km)</div></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🏃 러닝 기록 추가</div>
    <div class="field-group">
      <div class="field-lbl">날짜</div>
      <input class="field-inp" type="date" id="s-date">
    </div>
    <div class="row-3">
      <div class="field-group" style="margin-bottom:0"><div class="field-lbl">거리 (km)</div><input class="field-inp" type="number" step="0.01" id="s-km" placeholder="3.50"></div>
      <div class="field-group" style="margin-bottom:0"><div class="field-lbl">시간 (분)</div><input class="field-inp" type="number" step="1" id="s-min" placeholder="25"></div>
      <div class="field-group" style="margin-bottom:0"><div class="field-lbl">칼로리</div><input class="field-inp" type="number" step="1" id="s-kcal" placeholder="—"></div>
    </div>
    <div class="pace-hint" id="pace-preview">페이스 —</div>
    <div class="field-group">
      <div class="field-lbl">📸 러닝 사진 (최대 2장)</div>
      <div class="photo-upload-grid">
        <div class="photo-slot">
          <label class="photo-lbl-btn" for="s-photo-1" id="s-lbl-1"><span style="font-size:20px">📷</span><span>사진 1</span></label>
          <img class="photo-prev" id="s-prev-1" src="" alt="">
          <button class="photo-del" id="s-del-1" onclick="delPhoto(1)">✕</button>
          <input type="file" id="s-photo-1" accept="image/*" style="display:none" onchange="onPhoto(1,this)">
        </div>
        <div class="photo-slot">
          <label class="photo-lbl-btn" for="s-photo-2" id="s-lbl-2"><span style="font-size:20px">📷</span><span>사진 2</span></label>
          <img class="photo-prev" id="s-prev-2" src="" alt="">
          <button class="photo-del" id="s-del-2" onclick="delPhoto(2)">✕</button>
          <input type="file" id="s-photo-2" accept="image/*" style="display:none" onchange="onPhoto(2,this)">
        </div>
      </div>
    </div>
    <div class="field-group">
      <div class="field-lbl">메모 (선택)</div>
      <textarea class="field-inp" id="s-memo" placeholder="오늘 러닝 어땠나요?" style="min-height:56px;resize:none;"></textarea>
    </div>
    <button class="save-btn" id="s-save-btn" onclick="saveRun()">저장</button>
    <div class="save-msg" id="s-msg"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
var STORE_KEY = 'rebirth_runs_v1';
function loadRuns() { try { var r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):[]; } catch(e){ return []; } }
function saveRuns(runs) { try { localStorage.setItem(STORE_KEY, JSON.stringify(runs)); } catch(e){} }
var DOW=['일','월','화','수','목','금','토'];
function formatDate(str) { var d=new Date(str+'T00:00:00'); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'; }
function todayStr() { var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pace(km,min) { if(!km||!min||+km===0)return'—'; var p=+min/+km,m=Math.floor(p),s=Math.round((p-m)*60); return m+"'"+String(s).padStart(2,'"')+('"'); }
var _photos={1:null,2:null};
function onPhoto(n,input) { if(!input.files||!input.files[0])return; var reader=new FileReader(); reader.onload=function(e){ _photos[n]=e.target.result; document.getElementById('s-prev-'+n).src=e.target.result; document.getElementById('s-prev-'+n).style.display='block'; document.getElementById('s-lbl-'+n).style.display='none'; document.getElementById('s-del-'+n).style.display='block'; }; reader.readAsDataURL(input.files[0]); }
function delPhoto(n) { _photos[n]=null; document.getElementById('s-prev-'+n).style.display='none'; document.getElementById('s-prev-'+n).src=''; document.getElementById('s-lbl-'+n).style.display='flex'; document.getElementById('s-del-'+n).style.display='none'; document.getElementById('s-photo-'+n).value=''; }
function openSheet() { _photos={1:null,2:null}; [1,2].forEach(function(n){delPhoto(n);}); ['s-km','s-min','s-kcal'].forEach(function(id){document.getElementById(id).value=''; document.getElementById(id).style.border='';}); document.getElementById('s-memo').value=''; document.getElementById('s-msg').textContent=''; document.getElementById('s-save-btn').disabled=false; document.getElementById('s-save-btn').textContent='저장'; document.getElementById('s-date').value=todayStr(); document.getElementById('pace-preview').textContent='페이스 —'; document.getElementById('overlay').classList.add('open'); }
function closeSheet() { document.getElementById('overlay').classList.remove('open'); }
function overlayClick(e) { if(e.target===document.getElementById('overlay'))closeSheet(); }
['s-km','s-min'].forEach(function(id){ document.getElementById(id).addEventListener('input',function(){ document.getElementById('pace-preview').textContent='페이스 '+pace(document.getElementById('s-km').value,document.getElementById('s-min').value)+' /km'; }); });
function saveRun() { var date=document.getElementById('s-date').value,km=document.getElementById('s-km').value,min=document.getElementById('s-min').value,kcal=document.getElementById('s-kcal').value,memo=document.getElementById('s-memo').value.trim(); if(!date){alert('날짜를 선택해주세요.');return;} if(!km||!min){alert('거리와 시간은 필수예요.');return;} var btn=document.getElementById('s-save-btn'); btn.disabled=true; btn.textContent='저장 중...'; var run={id:Date.now(),date:date,km:parseFloat(km),min:parseInt(min),kcal:kcal?parseInt(kcal):null,memo:memo,photos:[_photos[1],_photos[2]].filter(Boolean)}; var runs=loadRuns(); runs.unshift(run); saveRuns(runs); document.getElementById('s-msg').textContent='✅ 저장됐어요!'; setTimeout(function(){closeSheet();renderAll();},800); }
function deleteRun(id) { if(!confirm('이 기록을 삭제할까요?'))return; saveRuns(loadRuns().filter(function(r){return r.id!==id;})); renderAll(); }
function openLightbox(src) { document.getElementById('lightbox-img').src=src; document.getElementById('lightbox').classList.add('open'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function setTab(t,btn) { document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');}); btn.classList.add('active'); document.getElementById('view-log').style.display=t==='log'?'block':'none'; document.getElementById('view-stat').style.display=t==='stat'?'block':'none'; if(t==='stat')renderStat(); }
function renderList() { var runs=loadRuns(),el=document.getElementById('run-list'); if(runs.length===0){el.innerHTML='<div class="empty"><div class="empty-icon">🏃</div><div class="empty-title">아직 러닝 기록이 없어요</div><p style="font-size:13px;color:var(--text-3);">기록하기로 오늘 러닝을 추가해보세요!</p></div>';return;} el.innerHTML=runs.map(function(r){ var p=pace(r.km,r.min),photos=r.photos||[]; var ph=photos.length>0?'<div class="run-photos '+(photos.length>=2?'cols-2':'')+'">'+photos.map(function(s){return'<img class="run-photo-img" src="'+s+'" onclick="openLightbox(this.src)">';}).join('')+'</div>':''; var memo=r.memo?'<div class="run-memo">'+r.memo+'</div>':''; return'<div class="run-card"><div class="run-card-head"><div class="run-date">'+formatDate(r.date)+'</div><button class="run-delete-btn" onclick="deleteRun('+r.id+')">🗑</button></div><div class="run-metrics"><div class="run-metric"><div class="run-metric-val teal">'+r.km+'</div><div class="run-metric-lbl">km</div></div><div class="run-metric"><div class="run-metric-val">'+r.min+'</div><div class="run-metric-lbl">분</div></div><div class="run-metric"><div class="run-metric-val">'+p+'</div><div class="run-metric-lbl">페이스</div></div><div class="run-metric"><div class="run-metric-val">'+(r.kcal||'—')+'</div><div class="run-metric-lbl">kcal</div></div></div>'+ph+memo+'</div>'; }).join(''); }
function renderHero() { var runs=loadRuns(),totalKm=runs.reduce(function(s,r){return s+r.km;},0),dateSet={},streak=0,cur=new Date(); runs.forEach(function(r){dateSet[r.date]=true;}); for(var i=0;i<365;i++){var ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'); if(dateSet[ds]){streak++;cur.setDate(cur.getDate()-1);}else if(i===0){cur.setDate(cur.getDate()-1);}else break;} document.getElementById('stat-total-km').textContent=totalKm.toFixed(1); document.getElementById('stat-count').textContent=runs.length; document.getElementById('stat-streak').textContent=streak; document.getElementById('header-sub').textContent='총 '+runs.length+'회 · '+totalKm.toFixed(1)+'km · '+streak+'일 연속'; }
function renderStat() { var runs=loadRuns(); if(runs.length===0)return; document.getElementById('best-km').textContent=Math.max.apply(null,runs.map(function(r){return r.km;})); document.getElementById('best-min').textContent=Math.max.apply(null,runs.map(function(r){return r.min;}))+'분'; document.getElementById('avg-km').textContent=(runs.reduce(function(s,r){return s+r.km;},0)/runs.length).toFixed(1); var pa=runs.filter(function(r){return r.km&&r.min;}).map(function(r){return{p:r.min/r.km,r:r};}),bp=pa.length?pa.reduce(function(a,b){return a.p<b.p?a:b;}):null; document.getElementById('best-pace').textContent=bp?pace(bp.r.km,bp.r.min):'—'; var barsEl=document.getElementById('week-bars'),today=new Date(),days=[]; for(var i=6;i>=0;i--){var d=new Date(today);d.setDate(d.getDate()-i);var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');var dk=runs.filter(function(r){return r.date===ds;}).reduce(function(s,r){return s+r.km;},0);days.push({lbl:DOW[d.getDay()],km:dk,t:i===0});} var mx=Math.max.apply(null,days.map(function(d){return d.km;}))||1; barsEl.innerHTML=days.map(function(d){var h=Math.round((d.km/mx)*52);return'<div class="week-bar-wrap"><div class="week-bar-val">'+(d.km>0?d.km.toFixed(1):'')+' </div><div class="week-bar'+(d.t?' today':'')+'" style="height:'+(h||3)+'px;"></div><div class="week-bar-lbl">'+d.lbl+'</div></div>';}).join(''); }
function renderAll(){renderList();renderHero();}
renderAll();
</script>
</body>
</html>
